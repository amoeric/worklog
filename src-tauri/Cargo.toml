[package]
name = "worklog-app"
version = "0.1.0"
edition = "2024"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
directories = "6"
anyhow = "1"
open = "5"
# 只拿來打 Redmine／GitLab 的 API；用 rustls 免得綁系統 OpenSSL
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "charset"] }
urlencoding = "2"
# 線上更新：檢查 GitHub Releases 上的 latest.json，下載並換掉自己
tauri-plugin-updater = "2"
# 更新裝完要能自己重開
tauri-plugin-process = "2"
