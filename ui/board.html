<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>看板 — 每日工作日誌</title>
<link href="css/fonts.css" rel="stylesheet">
<link href="css/app.css" rel="stylesheet">
<script src="vendor/tailwind.js"></script>
<script src="js/tailwind-config.js"></script>
<script src="js/theme.js"></script>
<script src="js/store.js"></script>
<script src="js/shell.js"></script>
<style>
  /* 看板欄寬：有卡片的欄平分剩下的空間，空欄收成一條窄軌。
     拖曳經過窄軌時會加上 .is-open 暫時展開，放開後（還是 0 的話）自己收回去。 */
  [data-col] { transition: flex-basis .18s ease, min-width .18s ease; }
  [data-col="wide"] { flex: 1 1 0%; min-width: 15rem; max-width: 26.25rem; }
  [data-col="rail"] { flex: 0 0 2.75rem; min-width: 2.75rem; }
  [data-col="rail"].is-open { flex: 0 0 15rem; min-width: 15rem; }
  [data-col="rail"] [data-full] { display: none; }
  [data-col="rail"].is-open [data-rail] { display: none; }
  [data-col="rail"].is-open [data-full] { display: flex; }
  /* 窄軌上的狀態名直著寫 */
  .rail-name { writing-mode: vertical-rl; }

  /* 小視窗進場：跟 macOS 一樣，淡入帶一點點放大，很快就停 */
  @keyframes sheet-in { from { opacity: 0; transform: translateY(6px) scale(.98); } to { opacity: 1; transform: none; } }
  @keyframes veil-in  { from { opacity: 0; } to { opacity: 1; } }
  .sheet { animation: sheet-in .16s ease-out; }
  .veil  { animation: veil-in .16s ease-out; }
  @media (prefers-reduced-motion: reduce) { .sheet, .veil { animation: none; } }

  /* WebKit 的老問題：光有 draggable="true" 在 WKWebView 裡拖不動，
     要明講這個元素本身可以被拖。卡片裡的連結與按鈕則要關掉，
     不然從標題按下去會變成拖那條連結，卡片反而不動。 */
  [data-card] {
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;          /* 觸控板／觸控拖曳時不要被捲動搶走 */
    cursor: grab;
  }
  [data-card]:active { cursor: grabbing; }
  [data-card] a { cursor: pointer; }
</style>
</head>
<body class="flex h-screen flex-col overflow-hidden bg-paper text-ink antialiased dark:bg-dpaper dark:text-dink font-sans text-base" data-od-id="board-page">

<div data-shell="topbar" data-tab="board.html" data-crumb="看板"></div>

<div class="flex min-h-0 flex-1 flex-col">

  <div class="flex flex-wrap items-center gap-x-3 gap-y-2 px-4 pb-3 pt-4 md:px-6" data-od-id="board-toolbar">
    <h1 class="font-display shrink-0 text-3xl font-bold tracking-tightest md:text-4xl" data-od-id="board-title">看板</h1>
    <span id="board-date" class="shrink-0 self-end pb-1 text-muted dark:text-dmuted md:min-w-[21rem]" data-od-id="board-date"></span>
    <div id="day-nav" class="relative flex shrink-0 items-center gap-1 rounded-full border border-line bg-surface p-1 shadow-sm transition-opacity dark:border-dline dark:bg-dsurface" data-od-id="board-day-nav">
      <button id="btn-prev-day" class="grid h-8 w-8 place-items-center rounded-full text-muted hover:bg-accentsoft hover:text-ink dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink" aria-label="前一天"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="btn-cal" class="rounded-full px-3 py-1 leading-tight text-muted hover:bg-accentsoft hover:text-ink dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink" aria-haspopup="dialog" aria-expanded="false">日曆</button>
      <button id="btn-today" class="rounded-full px-3 py-1 leading-tight text-muted hover:bg-accentsoft hover:text-ink dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink">今天</button>
      <button id="btn-next-day" class="grid h-8 w-8 place-items-center rounded-full text-muted hover:bg-accentsoft hover:text-ink dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink" aria-label="後一天"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
      <div id="cal-pop" class="absolute left-0 top-full z-30 mt-2 hidden w-[20rem] rounded-xl border border-line bg-surface p-3 shadow-pop dark:border-dline dark:bg-dsurface" role="dialog" aria-label="選擇日期"></div>
    </div>
    <span id="scope-note" class="min-w-0 truncate text-muted dark:text-dmuted"></span>
    <span id="board-count" class="ml-auto shrink-0 tabular-nums text-muted dark:text-dmuted"></span>
    <div class="flex shrink-0 items-center gap-1 rounded-full border border-line bg-surface p-1 shadow-sm dark:border-dline dark:bg-dsurface" data-od-id="board-nav">
      <button id="btn-left" class="grid h-8 w-8 place-items-center rounded-full text-muted hover:bg-accentsoft hover:text-ink disabled:opacity-30 dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink" aria-label="往左捲一欄"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button id="btn-right" class="grid h-8 w-8 place-items-center rounded-full text-muted hover:bg-accentsoft hover:text-ink disabled:opacity-30 dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink" aria-label="往右捲一欄"><svg class="h-5 w-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
  </div>

  <!-- 開著過濾的時候要看得出來 -->
  <div id="filter-bar" class="hidden px-4 pb-3 md:px-6" data-od-id="filter-bar"></div>

  <div class="relative min-h-0 flex-1">
    <div id="board-scroll" class="h-full overflow-x-auto overflow-y-hidden px-4 pb-4 md:px-6">
      <div id="columns" class="flex h-full min-w-full gap-3" data-od-id="board-columns"></div>
    </div>
    <div data-edge="left" class="pointer-events-none absolute inset-y-0 left-0 w-10 bg-gradient-to-r from-paper to-transparent opacity-0 transition-opacity dark:from-dpaper"></div>
    <div data-edge="right" class="pointer-events-none absolute inset-y-0 right-0 w-10 bg-gradient-to-l from-paper to-transparent opacity-0 transition-opacity dark:from-dpaper"></div>
  </div>
</div>

<script>
window.Log.ready(function () {
  var L = window.Log;
  var params = new URLSearchParams(location.search);
  var day = params.get('d');
  if (day && !/^\d{8}$/.test(day)) day = null;

  /* 一段期間：兩端都要是合法日期才算數 */
  var from = params.get('from');
  var to = params.get('to');
  if (!/^\d{8}$/.test(from || '') || !/^\d{8}$/.test(to || '')) { from = null; to = null; }
  if (from && to && from > to) { var swap = from; from = to; to = swap; }

  /* 日曆上選區間時，按了第一下之後停在這裡等第二下 */
  var picking = null;

  var scope = from ? 'range' : day ? 'day' : 'all';

  /* 搜尋：關鍵字由工具列的搜尋框管，看板只負責過濾卡片。
     六欄一律留著，只是卡片變少、數字跟著變。 */
  var query = (window.Shell && window.Shell.searchQuery) ? window.Shell.searchQuery() : '';

  function filtering() {
    return L.searchTerms(query).length > 0;
  }

  var CARD = 'rounded-lg border border-line bg-surface p-2.5 shadow-sm dark:border-dline dark:bg-dsurface';

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function touchedOn(code) {
    var ids = {};
    L.entriesOf(code).forEach(function (e) { if (e.item) ids[e.item] = true; });
    return ids;
  }

  /* 起訖之間（含兩端）有推進到的工作項目。日期是 8 碼數字，字串比大小就夠 */
  function touchedBetween(a, b) {
    var ids = {};
    L.allCodes().forEach(function (code) {
      if (code < a || code > b) return;
      L.entriesOf(code).forEach(function (e) { if (e.item) ids[e.item] = true; });
    });
    return ids;
  }

  /* 目前看的是哪一段：單日也當成一段，其他地方就不用分兩種寫 */
  function span() {
    if (scope === 'day' && day) return { from: day, to: day };
    if (scope === 'range' && from && to) return { from: from, to: to };
    return null;
  }

  function visibleItems() {
    var all = L.allItems();
    if (scope === 'day' && day) {
      var ids = touchedOn(day);
      all = all.filter(function (it) { return ids[it.id]; });
    } else if (scope === 'range' && from && to) {
      var inRange = touchedBetween(from, to);
      all = all.filter(function (it) { return inRange[it.id]; });
    }
    return all.filter(function (it) { return L.matchesSearch(L.itemSearchFields(it), query); });
  }

  function linkTag(href) {
    return '<a href="' + esc(href) + '" target="_blank" rel="noopener" class="shrink-0 hover:opacity-80">' + L.linkBadge(href) + '</a>';
  }

  /* 移動到…：卡片右上角那顆按鈕點開的中文狀態清單。
     跟拖曳做同一件事，但觸控沒有拖曳，這條路一定要留著。 */
  function moveMenu(item) {
    var opts = L.statuses().map(function (s) {
      var on = s.id === item.status;
      return '<button type="button" data-move-to="' + s.id + '" ' +
        'class="flex w-full items-center gap-2 rounded-md px-2 py-1.5 text-left leading-tight ' +
        (on ? 'font-semibold text-ink dark:text-dink'
            : 'text-muted hover:bg-accentsoft hover:text-ink dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink') + '">' +
        '<span class="h-2 w-2 shrink-0 rounded-full ' + L.statusDotClass(s.id) + '"></span>' +
        '<span class="min-w-0 flex-1 truncate">' + esc(L.statusText(s.id)) + '</span>' +
      '</button>';
    }).join('');

    return '' +
      '<div data-menu class="absolute right-1 top-8 z-20 hidden w-32 rounded-lg border border-line bg-surface p-1 shadow-pop dark:border-dline dark:bg-dsurface">' +
        opts +
      '</div>';
  }

  /* 那顆按鈕只在滑鼠移到卡片上才出現；sm 以下沒有 hover，所以一直顯示 */
  function moveButton() {
    return '' +
      '<button type="button" data-menu-btn aria-label="移動到別的狀態" aria-haspopup="true" aria-expanded="false" ' +
      'class="absolute right-1 top-1 grid h-6 w-6 place-items-center rounded-md text-muted opacity-100 hover:bg-accentsoft hover:text-ink sm:opacity-0 sm:group-hover:opacity-100 dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink">' +
        '<svg class="h-4 w-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">' +
          '<path d="M4 12h11"/><path d="M12 7l5 5-5 5"/><path d="M20 5v14"/>' +
        '</svg>' +
      '</button>';
  }

  /* 點進別頁時把目前的範圍一起帶著，回來才回得到同一段 */
  function backParams() {
    if (scope === 'day' && day) return '&d=' + day;
    if (scope === 'range' && from && to) return '&from=' + from + '&to=' + to;
    return '';
  }

  /* dim：已歸檔那欄整欄退到背景，標題文字也跟著變灰 */
  function card(item, dim) {
    var stay = (item.status === 'todo' || item.status === 'parked')
      ? '<span class="shrink-0">' + L.stayLabel(item.since) + '</span>' : '';

    var links = (item.issue ? linkTag(item.issue) : '') + (item.mr ? linkTag(item.mr) : '');

    return '' +
      '<div data-card="' + item.id + '" data-od-id="card-' + item.id + '" ' +
      'class="group relative cursor-grab ' + CARD + ' hover:border-muted active:cursor-grabbing dark:hover:border-dmuted">' +
        '<a href="work-item.html?id=' + item.id + backParams() + '" ' +
        'class="block pr-7 leading-snug underline-offset-4 hover:underline' + (dim ? ' text-muted dark:text-dmuted' : '') + '">' + esc(item.title) + '</a>' +
        moveButton() +
        moveMenu(item) +
        '<div class="mt-2 flex flex-wrap items-center gap-x-2.5 gap-y-1 text-muted dark:text-dmuted">' +
          '<span class="shrink-0 font-mono">' + esc(item.project) + '</span>' +
          (item.tasks ? '<span class="shrink-0 tabular-nums">' + item.tasks.done + '/' + item.tasks.total + '</span>' : '') +
          stay +
        '</div>' +
        (links ? '<div class="mt-2 flex flex-wrap items-center gap-2">' + links + '</div>' : '') +
      '</div>';
  }

  /* 欄頭只講一次事情：圓點 + 中文狀態名 + 數字，不再放英文藥丸。
     自己加的狀態右邊多一個刪除鈕（內建八個沒有）。 */
  function columnHead(st, n) {
    var dim = st.id === 'archived' ? ' text-muted dark:text-dmuted' : '';
    var del = st.builtin ? '' :
      '<button data-del-status="' + st.id + '" title="刪掉這個狀態" aria-label="刪掉狀態 ' + esc(st.zh) + '" ' +
      'class="grid h-5 w-5 shrink-0 place-items-center rounded-full text-muted opacity-0 hover:bg-accentsoft hover:text-ink group-hover/col:opacity-100 dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink">' +
        '<svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>' +
      '</button>';
    return '' +
      '<div class="flex shrink-0 items-center gap-2 px-1 pb-2">' +
        '<button data-open-status="' + st.id + '" title="看「' + esc(st.zh) + '」的所有項目" ' +
        'class="-mx-1 flex min-w-0 flex-1 items-center gap-2 rounded-md px-1 py-0.5 text-left hover:bg-black/5 dark:hover:bg-white/10">' +
          '<span class="h-2 w-2 shrink-0 rounded-full ' + L.statusDotClass(st.id) + '"></span>' +
          '<span class="min-w-0 flex-1 truncate font-medium' + dim + '">' + esc(L.statusText(st.id)) + '</span>' +
          '<span class="shrink-0 tabular-nums text-muted dark:text-dmuted">' + n + '</span>' +
        '</button>' +
        del +
      '</div>';
  }

  function columnBody(st, items) {
    var dim = st.id === 'archived';
    return '' +
      columnHead(st, items.length) +
      '<div data-list class="flex min-h-0 flex-1 flex-col gap-2 overflow-y-auto rounded-md">' +
        items.map(function (it) { return card(it, dim); }).join('') +
        '<a href="todo-list.html" class="shrink-0 rounded-lg border border-dashed border-line px-2.5 py-2 text-muted hover:bg-surface hover:text-ink dark:border-dline dark:text-dmuted dark:hover:bg-dsurface dark:hover:text-dink">＋ 記到 TODO</a>' +
      '</div>';
  }

  var COL = 'group/col flex h-full flex-col rounded-xl border border-line p-2 dark:border-dline ';

  function column(st, items) {
    /* 0 件的欄收成窄軌：只留圓點、0 與直排的狀態名，寬度讓給真正在看的欄。
       完整內容還是畫在 data-full 裡，拖曳經過時展開就有得放。 */
    if (!items.length) {
      return '' +
        '<section data-drop="' + st.id + '" data-col="rail" data-od-id="column-' + st.id + '" ' +
        'class="' + COL + 'overflow-hidden ' + L.groupClass(st.id) + '">' +
          '<button data-rail data-open-status="' + st.id + '" title="看「' + esc(st.zh) + '」的所有項目" ' +
          'class="flex min-h-0 flex-1 flex-col items-center gap-2 rounded-md pt-1 hover:bg-black/5 dark:hover:bg-white/10">' +
            '<span class="h-2 w-2 shrink-0 rounded-full ' + L.statusDotClass(st.id) + '"></span>' +
            '<span class="shrink-0 tabular-nums text-muted dark:text-dmuted">0</span>' +
            '<span class="rail-name min-h-0 flex-1 overflow-hidden text-muted dark:text-dmuted">' + esc(L.statusText(st.id)) + '</span>' +
          '</button>' +
          '<div data-full class="min-h-0 flex-1 flex-col">' + columnBody(st, items) + '</div>' +
        '</section>';
    }

    return '' +
      '<section data-drop="' + st.id + '" data-col="wide" data-od-id="column-' + st.id + '" ' +
      'class="' + COL + L.groupClass(st.id) + '">' +
        columnBody(st, items) +
      '</section>';
  }

  function renderScope() {
    /* 範圍（全部／某一天／一段期間）都從日曆裡選。
       前後一天只有看單日時說得通；「今天」與日曆隨時能按。 */
    var nav = document.getElementById('day-nav');
    var onDay = scope === 'day';
    nav.querySelectorAll('button').forEach(function (b) {
      b.disabled = (b.id === 'btn-prev-day' || b.id === 'btn-next-day') ? !onDay : false;
      b.classList.toggle('opacity-40', b.disabled);
    });

    var note;
    var sp = span();
    if (scope === 'day' && day) {
      note = visibleItems().length
        ? '只看 ' + L.fileName(day) + ' 有推進的項目'
        : filtering()
          ? L.fileName(day) + ' 這天沒有符合關鍵字的項目'
          : L.fileName(day) + ' 這天沒有推進任何工作項目';
    } else if (scope === 'range' && sp) {
      note = picking
        ? '再點一天決定結束日'
        : visibleItems().length
          ? '只看這段期間有推進的項目'
          : filtering()
            ? '這段期間沒有符合關鍵字的項目'
            : '這段期間沒有推進任何工作項目';
    } else {
      note = '把卡片拖到別欄就改狀態，直接寫進今天的 md';
    }
    document.getElementById('scope-note').textContent = note;
  }

  /* 開著過濾很容易忘記，所以直接寫出關鍵字與命中幾件 */
  function renderFilter(total) {
    var bar = document.getElementById('filter-bar');
    if (!filtering()) { bar.classList.add('hidden'); bar.innerHTML = ''; return; }
    bar.classList.remove('hidden');
    bar.innerHTML = '' +
      '<div class="flex flex-wrap items-center gap-2 rounded-xl border border-line bg-accentsoft px-3 py-2 dark:border-dline dark:bg-daccentsoft">' +
        '<span class="min-w-0 flex-1 truncate">正在用「' + esc(query) + '」過濾，共 ' + total + ' 筆</span>' +
        '<button id="clear-filter" class="shrink-0 rounded-full border border-line bg-surface px-3 py-1 leading-tight shadow-sm hover:bg-accentsoft dark:border-dline dark:bg-dsurface dark:hover:bg-dpaper">清除</button>' +
      '</div>';
    document.getElementById('clear-filter').addEventListener('click', function () {
      if (window.Shell && window.Shell.setSearchQuery) window.Shell.setSearchQuery('');
    });
  }

  /* 改狀態：後端直接寫進今天的 md。
     寫成功就講一聲寫到哪個檔；失敗要說原因，並且重畫一次，
     讓畫面回到跟檔案一致的狀態（卡片退回原本的欄位）。 */
  function move(itemId, statusId) {
    L.moveItem(itemId, statusId).then(function (r) {
      render();
      if (!r || r.unchanged) return;
      var how = r.updated ? '已寫進 ' : (r.created ? '已建立 ' : '已寫進 ');
      say(how + r.file + '：' + r.status_zh);
    }).catch(function (e) {
      render();
      say(String((e && e.message) || e || '寫不進日誌檔'), 'error');
    });
  }

  function say(msg, kind) {
    if (window.Shell && window.Shell.toast) window.Shell.toast(msg, kind);
  }

  /* 卡片上的移動選單一次只開一個，點別的地方就收起來 */
  function closeMenus(except) {
    document.querySelectorAll('[data-menu]').forEach(function (m) {
      if (m === except) return;
      m.classList.add('hidden');
      var b = m.parentElement && m.parentElement.querySelector('[data-menu-btn]');
      if (b) { b.setAttribute('aria-expanded', 'false'); b.style.opacity = ''; }
    });
  }

  document.addEventListener('click', function () { closeMenus(null); });

  var RING = ['ring-2', 'ring-inset', 'ring-accent', 'rounded-lg', 'dark:ring-daccent'];

  /* ---------- 拖放 ----------
     HTML5 的 draggable 在 WKWebView 裡按住完全沒反應，所以自己做。
     起手式綁在卡片上，移動與放開一律綁在 document——滑鼠一離開卡片，
     事件就不再送到那張卡（setPointerCapture 也擋不住），掛 document 才不會漏。
     這幾支放在模組層級：wire() 每次 render 都重跑，但 document 監聽器只掛一次，
     兩邊若在不同閉包裡就會失聯（卡片拖得動、放開卻沒反應）。 */
  var drag = null;
  var dragWired = false;

  function boardCols() {
    return document.getElementById('columns');
  }

  /* 用每一欄的實際範圍判斷游標落在哪裡。
     不用 elementFromPoint：拖曳中畫面上有跟著游標的複本、欄位又會展開，
     那個 API 在 WKWebView 裡不一定回我們要的元素。 */
  function columnAt(x, y) {
    var cols = boardCols();
    if (!cols) return null;
    var hit = null;
    cols.querySelectorAll('[data-drop]').forEach(function (c) {
      if (hit) return;
      var r = c.getBoundingClientRect();
      if (x >= r.left && x <= r.right && y >= r.top && y <= r.bottom) hit = c;
    });
    return hit;
  }

  function highlight(col) {
    var cols = boardCols();
    if (!cols) return;
    cols.querySelectorAll('[data-drop]').forEach(function (c) {
      var list = c.querySelector('[data-list]');
      if (c === col) {
        c.classList.add('is-open');
        if (list) list.classList.add.apply(list.classList, RING);
      } else {
        c.classList.remove('is-open');
        if (list) list.classList.remove.apply(list.classList, RING);
      }
    });
  }

  function endDrag() {
    if (!drag) return;
    if (drag.ghost && drag.ghost.parentNode) drag.ghost.parentNode.removeChild(drag.ghost);
    drag.card.classList.remove('opacity-40');
    drag = null;
    highlight(null);
  }

  function onDragMove(e) {
    if (!drag) return;
    var card = drag.card;

    if (!drag.started) {
      /* 手指／滑鼠只是抖一下不算拖 */
      if (Math.abs(e.clientX - drag.x) + Math.abs(e.clientY - drag.y) < 6) return;
      drag.started = true;
      var r = card.getBoundingClientRect();
      var ghost = card.cloneNode(true);
      ghost.style.position = 'fixed';
      ghost.style.left = r.left + 'px';
      ghost.style.top = r.top + 'px';
      ghost.style.width = r.width + 'px';
      ghost.style.margin = '0';
      ghost.style.pointerEvents = 'none';
      ghost.style.zIndex = '60';
      ghost.style.opacity = '0.95';
      ghost.style.transform = 'rotate(1.5deg)';
      ghost.style.boxShadow = '0 12px 32px rgba(0,0,0,0.18)';
      document.body.appendChild(ghost);
      drag.ghost = ghost;
      drag.offX = drag.x - r.left;
      drag.offY = drag.y - r.top;
      card.classList.add('opacity-40');
    }

    if (e.cancelable) e.preventDefault();
    drag.ghost.style.left = (e.clientX - drag.offX) + 'px';
    drag.ghost.style.top = (e.clientY - drag.offY) + 'px';
    highlight(columnAt(e.clientX, e.clientY));
  }

  function onDragUp(e) {
    if (!drag) return;
    var started = drag.started;
    var id = drag.id;
    var col = started ? columnAt(e.clientX, e.clientY) : null;
    endDrag();
    if (!started) return;                       /* 只是點一下 */
    if (!col) { say('沒有放在任何一欄上，狀態沒變'); return; }
    move(id, col.getAttribute('data-drop'));
  }

  function wireCardDrag(cols) {
    cols.querySelectorAll('[data-card]').forEach(function (card) {
      card.addEventListener('pointerdown', function (e) {
        if (e.button !== 0) return;
        /* 連結、按鈕、選單自己有事情要做，不要當成拖曳的起點 */
        if (e.target.closest && e.target.closest('a, button, select, [data-menu]')) return;
        closeMenus(null);
        drag = { id: card.getAttribute('data-card'), card: card, x: e.clientX, y: e.clientY, started: false };
      });
    });

    if (dragWired) return;
    dragWired = true;
    document.addEventListener('pointermove', onDragMove, { passive: false });
    document.addEventListener('pointerup', onDragUp);
    document.addEventListener('pointercancel', endDrag);
    /* 有些環境只送 mouse 事件，補一條同樣的路 */
    document.addEventListener('mousemove', function (e) { if (drag) onDragMove(e); }, { passive: false });
    document.addEventListener('mouseup', function (e) { if (drag) onDragUp(e); });
  }

  function wire() {
    var cols = document.getElementById('columns');

    wireCardDrag(cols);


    /* 觸控沒有拖曳，改狀態走卡片右上角的「移動到…」 */
    cols.querySelectorAll('[data-menu-btn]').forEach(function (btn) {
      var wrap = btn.parentElement;
      var menu = wrap.querySelector('[data-menu]');
      btn.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var open = menu.classList.contains('hidden');
        closeMenus(open ? menu : null);
        menu.classList.toggle('hidden', !open);
        btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        /* 選單開著的時候按鈕不能跟著 hover 消失 */
        btn.style.opacity = open ? '1' : '';
        if (open && menu.scrollIntoView) menu.scrollIntoView({ block: 'nearest', inline: 'nearest' });
      });
      btn.addEventListener('focus', function () { btn.style.opacity = '1'; });
      btn.addEventListener('blur', function () {
        if (menu.classList.contains('hidden')) btn.style.opacity = '';
      });
      /* 按這顆不該把卡片拖起來 */
      btn.addEventListener('mousedown', function (e) { e.stopPropagation(); });
    });

    cols.querySelectorAll('[data-move-to]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.preventDefault();
        e.stopPropagation();
        var host = b.closest('[data-card]');
        if (!host) return;
        closeMenus(null);
        move(host.getAttribute('data-card'), b.getAttribute('data-move-to'));
      });
    });
  }

  /* 捲軸全站藏起來了，所以橫向捲動要另外給線索：
     兩側淡出、滾輪直接橫捲、工具列有左右箭頭。 */
  var scroller = document.getElementById('board-scroll');
  var edgeLeft = document.querySelector('[data-edge="left"]');
  var edgeRight = document.querySelector('[data-edge="right"]');
  var btnLeft = document.getElementById('btn-left');
  var btnRight = document.getElementById('btn-right');

  function updateEdges() {
    var max = scroller.scrollWidth - scroller.clientWidth;
    var atStart = scroller.scrollLeft <= 4;
    var atEnd = scroller.scrollLeft >= max - 4;
    edgeLeft.style.opacity = atStart ? '0' : '1';
    edgeRight.style.opacity = (max <= 4 || atEnd) ? '0' : '1';
    btnLeft.disabled = atStart;
    btnRight.disabled = max <= 4 || atEnd;
  }

  function scrollByColumn(dir) {
    var col = scroller.querySelector('[data-col="wide"]') || scroller.querySelector('[data-drop]');
    var step = col ? col.getBoundingClientRect().width + 12 : 300;
    scroller.scrollBy({ left: dir * step, behavior: 'smooth' });
  }

  scroller.addEventListener('scroll', updateEdges);
  window.addEventListener('resize', updateEdges);
  btnLeft.addEventListener('click', function () { scrollByColumn(-1); });
  btnRight.addEventListener('click', function () { scrollByColumn(1); });

  /* 滑鼠只有直向滾輪，把它轉成橫捲；觸控板本來就會橫捲，那種就別攔。
     但指標停在某一欄的卡片清單上、而且那一欄自己還捲得動的時候，
     直向滾輪就是要捲那一欄——卡片多的時候不然會看不到下面的卡。
     捲到那一欄的頭或底了才把滾輪還給橫捲。 */
  function canScrollList(el, down) {
    if (!el) return false;
    if (el.scrollHeight - el.clientHeight <= 1) return false;
    return down
      ? el.scrollTop + el.clientHeight < el.scrollHeight - 1
      : el.scrollTop > 0;
  }

  scroller.addEventListener('wheel', function (e) {
    if (e.deltaX !== 0 || e.shiftKey) return;
    var list = e.target.closest ? e.target.closest('[data-list]') : null;
    if (canScrollList(list, e.deltaY > 0)) return;
    var max = scroller.scrollWidth - scroller.clientWidth;
    if (max <= 4) return;
    e.preventDefault();
    scroller.scrollLeft += e.deltaY;
  }, { passive: false });

  /* ---------- 選日期：日曆彈出層與換日 ---------- */
  var calMonth = null;
  var calPop = document.getElementById('cal-pop');
  var btnCal = document.getElementById('btn-cal');

  function renderCal() {
    var cur = day || L.today();
    var p = L.parts(cur);
    if (!calMonth) calMonth = { year: p.year, month: p.month };
    var year = calMonth.year;
    var days = new Date(year, calMonth.month, 0).getDate();
    var lead = new Date(year, calMonth.month - 1, 1).getDay();

    var onRange = scope === 'range';
    var a = picking || (onRange ? from : null);
    var b = picking ? null : (onRange ? to : null);

    var cells = '';
    for (var i = 0; i < lead; i++) cells += '<span></span>';
    for (var d = 1; d <= days; d++) {
      var code = String(calMonth.year) + L.pad(calMonth.month, 2) + L.pad(d, 2);
      var n = L.countOf(code);
      var isEnd = onRange && (code === a || code === b);
      var inside = onRange && a && b && code > a && code < b;
      var isCur = !onRange && code === cur;
      var cls = isEnd || isCur
        ? 'bg-accent font-semibold text-white dark:bg-daccent'
        : inside
          ? 'bg-accentsoft font-medium text-ink dark:bg-daccentsoft dark:text-dink'
          : n > 0
            ? 'font-medium text-ink hover:bg-accentsoft dark:text-dink dark:hover:bg-daccentsoft'
            : 'text-muted hover:bg-accentsoft dark:text-dmuted dark:hover:bg-daccentsoft';
      var dot = n > 0 && !isEnd && !isCur;
      cells += '<button data-pick="' + code + '" class="relative grid h-9 place-items-center rounded-full tabular-nums ' + cls + '">' + d +
        (dot ? '<span class="absolute bottom-1 h-1 w-1 rounded-full bg-accent dark:bg-daccent"></span>' : '') +
        '</button>';
    }

    calPop.innerHTML = '' +
      '<div class="mb-2 flex items-center gap-2">' +
        '<button data-cal="-1" class="grid h-8 w-8 place-items-center rounded-full text-muted hover:bg-accentsoft hover:text-ink dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink" aria-label="上個月">‹</button>' +
        '<span class="flex-1 text-center font-semibold tabular-nums">' + calMonth.year + '年 ' + calMonth.month + '月</span>' +
        '<button data-cal="1" class="grid h-8 w-8 place-items-center rounded-full text-muted hover:bg-accentsoft hover:text-ink dark:text-dmuted dark:hover:bg-daccentsoft dark:hover:text-dink" aria-label="下個月">›</button>' +
      '</div>' +
      '<div class="grid grid-cols-7 gap-0.5 text-center text-muted dark:text-dmuted">' +
        L.WEEKDAYS.map(function (w) { return '<span class="py-1">' + w + '</span>'; }).join('') +
      '</div>' +
      '<div class="grid grid-cols-7 gap-0.5">' + cells + '</div>' +
      '<div class="mt-3 flex items-center gap-1 rounded-full bg-accentsoft p-1 dark:bg-daccentsoft">' +
        calTab('all', '全部', scope === 'all') +
        calTab('range', '一段期間', onRange) +
      '</div>' +
      '<p class="mt-2 text-muted dark:text-dmuted">' +
        (scope === 'range'
          ? (picking ? '再點一天決定結束日' : '點一天當起始日，再點一天當結束日')
          : '點一天只看那天；有點的日子表示那天有日誌') +
      '</p>';

    calPop.querySelectorAll('[data-scope]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var id = b.getAttribute('data-scope');
        picking = null;
        if (id === 'all') {
          scope = 'all';
          closeCal();
        } else if (scope === 'range') {
          /* 再按一次就退回看單日 */
          scope = 'day';
          if (!day) day = L.latestCode();
        } else {
          scope = 'range';
          if (!(from && to)) {
            to = day || L.latestCode();
            from = L.shift(to, -6);
          }
          renderCal();
        }
        render();
      });
    });

    calPop.querySelectorAll('[data-cal]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        var m = calMonth.month + Number(b.getAttribute('data-cal'));
        var y = calMonth.year;
        if (m < 1) { m = 12; y -= 1; }
        if (m > 12) { m = 1; y += 1; }
        calMonth = { year: y, month: m };
        renderCal();
      });
    });
    calPop.querySelectorAll('[data-pick]').forEach(function (b) {
      b.addEventListener('click', function (e) {
        e.stopPropagation();
        pickDay(b.getAttribute('data-pick'));
      });
    });
  }

  function calTab(id, label, on) {
    return '<button data-scope="' + id + '" class="flex-1 rounded-full px-3 py-1 leading-tight ' +
      (on ? 'bg-surface font-semibold text-ink shadow-sm dark:bg-dline dark:text-dink'
          : 'text-muted hover:text-ink dark:text-dmuted dark:hover:text-dink') +
      '">' + label + '</button>';
  }

  function openCal() {
    calMonth = null;
    calPop.classList.remove('hidden');
    btnCal.setAttribute('aria-expanded', 'true');
    renderCal();
  }
  function closeCal() {
    calPop.classList.add('hidden');
    btnCal.setAttribute('aria-expanded', 'false');
  }

  function goDay(code) {
    day = code;
    scope = 'day';
    render();
  }

  /* 日曆上點一天。看單日就直接跳過去；選區間要點兩下，第一下起、第二下訖。 */
  function pickDay(code) {
    if (scope !== 'range') {
      closeCal();
      goDay(code);
      return;
    }
    if (!picking) {
      picking = code;
      render();
      renderCal();
      return;
    }
    from = picking <= code ? picking : code;
    to = picking <= code ? code : picking;
    picking = null;
    closeCal();
    render();
  }

  btnCal.addEventListener('click', function (e) {
    e.stopPropagation();
    if (calPop.classList.contains('hidden')) openCal(); else closeCal();
  });
  document.getElementById('btn-prev-day').addEventListener('click', function () { goDay(L.shift(day || L.today(), -1)); });
  document.getElementById('btn-next-day').addEventListener('click', function () { goDay(L.shift(day || L.today(), 1)); });
  document.getElementById('btn-today').addEventListener('click', function () { goDay(L.today()); });
  document.addEventListener('click', function (e) {
    if (!calPop.classList.contains('hidden') && !calPop.contains(e.target)) closeCal();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') { closeCal(); closeMenus(null); }
  });

  /* ---------- 新增狀態 ----------
     看板最右邊那一欄是入口。加出來的狀態跟內建的一樣：有自己的欄、
     卡片拖得進去、寫進日誌檔的就是它的中文標籤。 */

  function addColumn() {
    return '' +
      '<section data-col="add" data-od-id="column-add" ' +
      'class="' + COL + 'w-12 shrink-0 border-dashed">' +
        '<button id="btn-add-status" title="新增狀態" ' +
        'class="flex h-full w-full flex-col items-center gap-2 pt-1 text-muted hover:text-ink dark:text-dmuted dark:hover:text-dink">' +
          '<span class="shrink-0 text-lg leading-none">＋</span>' +
          '<span class="rail-name min-h-0 flex-1 overflow-hidden">新增狀態</span>' +
        '</button>' +
      '</section>';
  }

  /* 自己蓋一個小視窗。不用 alert／confirm——那會把整個 WebView 卡住。 */
  function modal(inner) {
    var el = document.createElement('div');
    el.className = 'veil fixed inset-0 z-50 grid place-items-center bg-black/25 p-4 backdrop-blur-[3px] dark:bg-black/50';
    el.innerHTML =
      '<div class="sheet w-full max-w-[27rem] rounded-2xl border border-line bg-surface p-5 shadow-pop ring-1 ring-black/5 dark:border-dline dark:bg-dsurface dark:ring-white/5" role="dialog" aria-modal="true">' +
        inner +
      '</div>';
    document.body.appendChild(el);
    function close() { el.remove(); document.removeEventListener('keydown', onKey); }
    function onKey(e) { if (e.key === 'Escape') close(); }
    el.addEventListener('click', function (e) { if (e.target === el) close(); });
    document.addEventListener('keydown', onKey);
    return { el: el, close: close };
  }

  /* 表單與按鈕沿用設定頁那一套，不要在這裡另創一種 */
  var FIELD = 'mt-1.5 w-full rounded-lg border border-line bg-surface px-3 py-2 shadow-sm outline-none transition focus:border-muted focus:ring-4 focus:ring-accentsoft dark:border-dline dark:bg-dpaper dark:focus:border-dmuted dark:focus:ring-daccentsoft';
  var LABEL = 'mt-3.5 block text-muted dark:text-dmuted';
  var BTN = 'rounded-full border border-line bg-surface px-4 py-2 leading-tight shadow-sm hover:bg-accentsoft dark:border-dline dark:bg-dsurface dark:hover:bg-daccentsoft';
  var BTN_GO = 'rounded-full bg-accent px-4 py-2 font-medium leading-tight text-white shadow-sm hover:opacity-90 disabled:opacity-40 dark:bg-daccent';
  var TITLE = 'font-display text-xl font-bold tracking-tightest';
  var SUB = 'mt-1.5 leading-snug text-muted dark:text-dmuted';
  var ERR = 'mt-3 hidden leading-snug text-accent dark:text-daccent';
  var FOOT = 'mt-5 flex justify-end gap-2';

  function openAddStatus() {
    var list = L.statuses();
    var opts = list.map(function (s, i) {
      var sel = i === list.length - 1 ? ' selected' : '';
      return '<option value="' + s.id + '"' + sel + '>' + esc(s.zh) + '</option>';
    }).join('');

    var m = modal(
      '<h2 class="' + TITLE + '">新增狀態</h2>' +
      '<p class="' + SUB + '">看板會多一欄，卡片拖得進去。</p>' +
      '<div class="mt-3 rounded-lg border border-line bg-paper px-3 py-2 font-mono text-sm text-muted dark:border-dline dark:bg-dpaper dark:text-dmuted">' +
        '- <span class="text-ink dark:text-dink">`<span id="ns-pv">驗收中</span>`</span> 某件事' +
      '</div>' +
      '<label class="' + LABEL + '">名稱' +
        '<input id="ns-zh" class="' + FIELD + ' text-ink dark:text-dink" placeholder="驗收中" maxlength="8">' +
      '</label>' +
      '<label class="' + LABEL + '">一句說明' +
        '<input id="ns-hint" class="' + FIELD + ' text-ink dark:text-dink" placeholder="等對方確認">' +
      '</label>' +
      '<label class="' + LABEL + '">插在哪一欄後面' +
        '<select id="ns-after" class="' + FIELD + ' text-ink dark:text-dink">' + opts + '</select>' +
      '</label>' +
      '<p id="ns-err" class="' + ERR + '"></p>' +
      '<div class="' + FOOT + '">' +
        '<button id="ns-cancel" class="' + BTN + '">取消</button>' +
        '<button id="ns-go" class="' + BTN_GO + '">新增</button>' +
      '</div>'
    );

    var zhEl = m.el.querySelector('#ns-zh');
    var hintEl = m.el.querySelector('#ns-hint');
    var afterEl = m.el.querySelector('#ns-after');
    var errEl = m.el.querySelector('#ns-err');
    var pvEl = m.el.querySelector('#ns-pv');
    zhEl.addEventListener('input', function () {
      pvEl.textContent = zhEl.value.trim() || '驗收中';
    });
    zhEl.focus();

    function fail(msg) {
      errEl.textContent = msg;
      errEl.classList.remove('hidden');
    }

    function go() {
      var zh = zhEl.value.trim();
      var hint = hintEl.value.trim();
      var afterId = afterEl.value;
      var afterZh = (L.statusById(afterId) || {}).zh || '';
      if (!zh) { fail('名稱不能空白'); return; }
      L.addStatus(zh, hint, afterId).then(function () {
        m.close();
        render();
        say('已新增狀態：' + zh);
        openRulesSync(zh, hint, afterZh);
      }).catch(function (e) { fail(String((e && e.message) || e)); });
    }

    m.el.querySelector('#ns-cancel').addEventListener('click', m.close);
    m.el.querySelector('#ns-go').addEventListener('click', go);
    m.el.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.isComposing) go();
    });
  }

  /* 新增完問一次要不要同步規則。
     不同步的話 Claude 不知道有這個狀態，寫日誌就不會用它——所以問，但不自己寫。 */
  function openRulesSync(zh, hint, afterZh) {
    var where = afterZh ? '接在「' + afterZh + '」後面' : '排在最後';
    var m = modal(
      '<h2 class="' + TITLE + '">要把「' + esc(zh) + '」寫進日誌規則嗎？</h2>' +
      '<p class="' + SUB + '">規則在 <span class="font-mono">~/.claude/CLAUDE.md</span>，是 Claude 寫日誌時看的。' +
        '不寫進去的話，看板認得這個狀態，但 Claude 不會用它。</p>' +
      '<p class="' + SUB + '">生命週期裡' + esc(where) + '，狀態表也會多一列。寫之前會先備份。</p>' +
      '<pre id="rs-text" class="mt-4 max-h-56 overflow-auto whitespace-pre-wrap rounded-lg border border-line bg-paper p-3 font-mono text-sm leading-relaxed text-muted dark:border-dline dark:bg-dpaper dark:text-dmuted">讀取中…</pre>' +
      '<p id="rs-err" class="' + ERR + '"></p>' +
      '<div class="' + FOOT + '">' +
        '<button id="rs-skip" class="' + BTN + '">先不要</button>' +
        '<button id="rs-go" class="' + BTN_GO + '">寫進規則</button>' +
      '</div>'
    );

    var pre = m.el.querySelector('#rs-text');
    var errEl = m.el.querySelector('#rs-err');
    var goBtn = m.el.querySelector('#rs-go');
    var next = '';

    L.rulesWithStatus(zh, hint, afterZh).then(function (r) {
      next = r.text;
      pre.textContent = next;
    }).catch(function (e) {
      pre.textContent = '';
      errEl.textContent = String((e && e.message) || e);
      errEl.classList.remove('hidden');
      goBtn.disabled = true;
    });

    m.el.querySelector('#rs-skip').addEventListener('click', m.close);
    goBtn.addEventListener('click', function () {
      if (!next) return;
      goBtn.disabled = true;
      L.saveRules(next).then(function (r) {
        m.close();
        say(r.backup ? '規則已更新，備份在 ' + r.backup : '規則已更新');
      }).catch(function (e) {
        goBtn.disabled = false;
        errEl.textContent = String((e && e.message) || e);
        errEl.classList.remove('hidden');
      });
    });
  }

  function askDeleteStatus(id) {
    var st = L.statusById(id);
    if (!st) return;
    var m = modal(
      '<h2 class="' + TITLE + '">刪掉狀態「' + esc(st.zh) + '」？</h2>' +
      '<p class="' + SUB + '">看板少一欄。日誌檔一個字都不會動——已經寫成這個標籤的行留在原地，只是 app 之後不認得它。</p>' +
      '<p class="' + SUB + '">日誌規則裡那一列要不要拿掉，得自己去設定頁改。</p>' +
      '<p id="ds-err" class="' + ERR + '"></p>' +
      '<div class="' + FOOT + '">' +
        '<button id="ds-cancel" class="' + BTN + '">取消</button>' +
        '<button id="ds-go" class="' + BTN_GO + '">刪掉</button>' +
      '</div>'
    );

    m.el.querySelector('#ds-cancel').addEventListener('click', m.close);
    m.el.querySelector('#ds-go').addEventListener('click', function () {
      L.deleteStatus(id).then(function () {
        m.close();
        render();
        say('已刪掉狀態：' + st.zh);
      }).catch(function (e) {
        var errEl = m.el.querySelector('#ds-err');
        errEl.textContent = String((e && e.message) || e);
        errEl.classList.remove('hidden');
      });
    });
  }

  document.addEventListener('click', function (e) {
    var add = e.target.closest && e.target.closest('#btn-add-status');
    if (add) { openAddStatus(); return; }
    var head = e.target.closest && e.target.closest('[data-open-status]');
    if (head) {
      var url = 'status.html?s=' + encodeURIComponent(head.getAttribute('data-open-status')) +
        (scope === 'day' && day ? '&d=' + day : '') +
        (scope === 'range' && from && to ? '&from=' + from + '&to=' + to : '');
      if (window.Shell && window.Shell.withSearch) url = window.Shell.withSearch(url);
      location.href = url;
      return;
    }
    var del = e.target.closest && e.target.closest('[data-del-status]');
    if (del) { e.stopPropagation(); askDeleteStatus(del.getAttribute('data-del-status')); }
  });

  function render() {
    var items = visibleItems();

    document.getElementById('columns').innerHTML = L.statuses().map(function (st) {
      return column(st, items.filter(function (it) { return it.status === st.id; }));
    }).join('') + addColumn();

    /* 現在看的是哪一段，標題旁邊與麵包屑都要看得到 */
    var sp2 = span();
    var where, crumbText;
    if (scope === 'day' && day) {
      where = L.fileName(day) + '　' + L.longLabel(day) + (day === L.today() ? '（今天）' : '');
      crumbText = '看板　' + L.fileName(day);
    } else if (scope === 'range' && sp2) {
      var n = L.daysBetween(sp2.from, sp2.to) + 1;
      where = L.shortLabel(sp2.from) + ' – ' + L.shortLabel(sp2.to) + '　共 ' + n + ' 天';
      crumbText = '看板　' + sp2.from + ' – ' + sp2.to;
    } else {
      where = '全部工作項目';
      crumbText = '看板';
    }
    document.getElementById('board-date').textContent = where;
    var crumb = document.querySelector('[data-od-id="crumb"]');
    if (crumb) crumb.textContent = crumbText;

    document.getElementById('board-count').textContent = items.length + ' 件';
    renderFilter(items.length);
    renderScope();
    wire();
    updateEdges();
    if (!calPop.classList.contains('hidden')) renderCal();
    var url = scope === 'day' && day
      ? 'board.html?d=' + day
      : scope === 'range' && from && to
        ? 'board.html?from=' + from + '&to=' + to
        : 'board.html';
    if (window.Shell && window.Shell.withSearch) url = window.Shell.withSearch(url);
    try { history.replaceState(null, '', url); } catch (e) {}
  }

  /* 工具列的搜尋框改了關鍵字就重畫，資料不用重讀 */
  document.addEventListener('worklog:search', function (e) {
    query = e.detail || '';
    render();
  });

  render();
});
</script>
</body>
</html>
